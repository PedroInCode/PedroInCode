<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Gustavo - Back-end Developer in Progress</title>
  <desc id="desc">Banner quase preto com o nome Pedro Gustavo, subtítulo Back-end Developer in Progress e uma janela de editor com código C#, com pequenos detalhes em roxo.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060607"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <!-- Brilho roxo bem sutil, estático -->
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.4">
      <stop offset="0%" stop-color="#854CC7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#854CC7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C2D91"/>
      <stop offset="100%" stop-color="#B48CE8"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#854CC7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#854CC7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#854CC7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9C9D1"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>

    <clipPath id="typeClip">
      <rect class="reveal" x="92" y="184" width="560" height="34"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }

    .pill  { animation: fadeIn 0.6s ease-out 0.1s both; }
    .name  { animation: fadeIn 0.7s ease-out 0.3s both; }
    .rule  { transform-box: fill-box; transform-origin: left center; animation: grow 0.6s ease-out 0.8s both; }
    .tags  { animation: fadeIn 0.6s ease-out 2.6s both; }
    .win   { animation: fadeIn 0.8s ease-out 0.4s both; }
    .l1    { animation: fadeIn 0.4s ease-out 1.1s both; }
    .l2    { animation: fadeIn 0.4s ease-out 1.5s both; }
    .l3    { animation: fadeIn 0.4s ease-out 1.9s both; }
    .l4    { animation: fadeIn 0.4s ease-out 2.3s both; }

    .reveal { transform-box: fill-box; transform-origin: left center; animation: type 1.4s linear 1s both; }
    .cursor { animation: move 1.4s linear 1s both, blink 1s steps(1) 2.4s infinite; }
    .caret  { animation: blink 1s steps(1) 2.8s infinite; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes type   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes move   { from { transform: translateX(0); } to { transform: translateX(552px); } }
    @keyframes blink  { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#round)">
    <!-- Fundo quase preto -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Etiqueta -->
    <g class="pill">
      <rect x="92" y="40" width="322" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="109" cy="54" r="4" fill="#854CC7"/>
      <text class="mono" x="122" y="59" font-size="13" fill="#A9A9B5" textLength="278" lengthAdjust="spacing">SENAC · Desenvolvimento de Sistemas</text>
    </g>

    <!-- Nome -->
    <text class="sans name" x="90" y="150" font-size="72" font-weight="800" fill="url(#nameGrad)" textLength="600" lengthAdjust="spacing">PEDRO GUSTAVO</text>
    <rect class="rule" x="92" y="166" width="72" height="4" rx="2" fill="url(#accent)"/>

    <!-- Subtítulo digitado -->
    <g clip-path="url(#typeClip)">
      <text class="sans" x="92" y="208" font-size="22" font-weight="600" fill="#9A9AA6" textLength="552" lengthAdjust="spacing">BACK-END DEVELOPER IN PROGRESS</text>
    </g>
    <rect class="cursor" x="92" y="188" width="3" height="28" fill="#B48CE8"/>

    <!-- Tags -->
    <g class="mono tags" font-size="14" font-weight="600">
      <rect x="92" y="244" width="52" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="118" y="264" text-anchor="middle" fill="#D9D9E0">C#</text>

      <rect x="154" y="244" width="64" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="186" y="264" text-anchor="middle" fill="#D9D9E0">.NET</text>

      <rect x="228" y="244" width="130" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="293" y="264" text-anchor="middle" fill="#D9D9E0">ASP.NET Core</text>

      <rect x="368" y="244" width="92" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="414" y="264" text-anchor="middle" fill="#D9D9E0">EF Core</text>
    </g>

    <!-- Janela de editor -->
    <g class="win">
      <rect x="770" y="52" width="350" height="216" rx="16" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <path d="M 770 68 a 16 16 0 0 1 16 -16 H 1104 a 16 16 0 0 1 16 16 V 92 H 770 Z" fill="#FFFFFF" fill-opacity="0.04"/>
      <circle cx="792" cy="72" r="5" fill="#FFFFFF" fill-opacity="0.18"/>
      <circle cx="810" cy="72" r="5" fill="#FFFFFF" fill-opacity="0.18"/>
      <circle cx="828" cy="72" r="5" fill="#FFFFFF" fill-opacity="0.18"/>
      <text class="mono" x="945" y="76" font-size="12" fill="#8A8A96" text-anchor="middle">Program.cs</text>

      <g class="mono" font-size="15">
        <g class="l1">
          <text x="790" y="126" fill="#55555F">1</text>
          <text x="815" y="126" xml:space="preserve"><tspan fill="#B48CE8">var</tspan><tspan fill="#E0E0E6"> app = builder.Build();</tspan></text>
        </g>
        <g class="l2">
          <text x="790" y="156" fill="#55555F">2</text>
          <text x="815" y="156" xml:space="preserve"><tspan fill="#E0E0E6">app.MapGet(</tspan><tspan fill="#A9A9B5">"/"</tspan><tspan fill="#E0E0E6">, () =&gt; </tspan><tspan fill="#A9A9B5">"Olá!"</tspan><tspan fill="#E0E0E6">);</tspan></text>
        </g>
        <g class="l3">
          <text x="790" y="186" fill="#55555F">3</text>
          <text x="815" y="186" fill="#E0E0E6">app.Run();</text>
        </g>
        <g class="l4">
          <text x="790" y="226" fill="#55555F">4</text>
          <text x="815" y="226" fill="#6B6B76" textLength="180" lengthAdjust="spacing">// sempre aprendendo</text>
        </g>
      </g>
      <rect class="caret" x="999" y="212" width="2" height="18" fill="#B48CE8"/>
    </g>

    <!-- Linha inferior fina -->
    <rect y="317" width="1200" height="3" fill="url(#line)"/>
  </g>
</svg>
